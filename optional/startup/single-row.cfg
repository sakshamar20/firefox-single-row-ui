// Firefox Single Row UI — load only the named helper from this profile.
(() => {
  if (Services.appinfo.inSafeMode) return;
  let loaded = false;
  const observer = {
    observe(win) {
      if (loaded || win.document.documentElement.getAttribute("windowtype") !== "navigator:browser") return;
      loaded = true;
      Services.obs.removeObserver(observer, "browser-delayed-startup-finished");
      try {
        const file = Services.dirsvc.get("UChrm", Components.interfaces.nsIFile);
        file.append("search-toggle.uc.js");
        if (!file.exists() || !file.isFile()) return;
        // Per-call permission for this one local file; no global script-load
        // security preference is changed.
        Services.scriptloader.loadSubScriptWithOptions(Services.io.newFileURI(file).spec, {
          target: win, ignoreCache: true, allowUnsafeURL: true
        });
      } catch (error) {
        Components.utils.reportError("Single Row UI helper: " + error);
      }
    }
  };
  Services.obs.addObserver(observer, "browser-delayed-startup-finished");
})();
